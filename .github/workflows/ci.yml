name: CI

on:
  push:
    branches: [main, sandbox]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
        continue-on-error: true

      # Sandbox: tries notmyfault from main with a history of its own, away from the demo pull requests.
      - uses: tashikomaaa/notmyfault@main
        with:
          junit: reports/junit.xml
          key: sandbox
          track-branches: sandbox
          mode: quarantine
          tolerate: flaky, broken
